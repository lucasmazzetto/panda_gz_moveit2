# MoveIt 3D perception: build an Octomap in the planning scene from a point cloud.
#
# Fed robot_vision's ENVIRONMENT cloud (/robot_vision/environment_cloud) — the full fused
# scene MINUS the detected objects — so the octomap captures real obstacles but never the
# manipulation target (which must stay reachable/graspable). The PointCloudOctomapUpdater
# also self-filters the robot's own links (grown by padding), so the robot is never added
# to the octomap either.
#
# Loaded onto the move_group node by move_group.launch.py. Requires moveit_ros_perception
# (which provides occupancy_map_monitor/PointCloudOctomapUpdater and the OccupancyMapMonitor).
octomap_frame: world          # octomap is expressed in the planning frame
octomap_resolution: 0.02      # voxel edge [m]

sensors:
  - robot_vision_octomap_updater

robot_vision_octomap_updater:
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
  point_cloud_topic: /robot_vision/environment_cloud
  max_range: 5.0
  point_subsample: 1          # keep every point (cloud is already voxel-downsampled upstream)
  padding_offset: 0.02        # extra self-filter padding [m] around robot links
  padding_scale: 1.0          # multiplicative self-filter padding around robot links
  max_update_rate: 1.0        # cap octomap rebuilds [Hz]
  filtered_cloud_topic: /move_group/octomap_filtered_cloud  # debug: points that survived filtering
